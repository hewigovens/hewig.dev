<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Numa: the sieve of Eratosthenes over 1..25, which is the app in one
       glance — the big teal dots are the primes, the numbers that refuse to
       be split. Generated, so the picture cannot be wrong about which ones
       they are. The tile matches Huely's and Tessa's: white, rx 106, the
       same hairline, so the four sit together on a home screen. -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="#FFFFFF" stroke="#E3DFE7" stroke-width="8"/>
  <g>
    <circle cx="128" cy="128" r="11" fill="#D8E5E2"/>
    <circle cx="192" cy="128" r="23" fill="#0E8A7D"/>
    <circle cx="256" cy="128" r="23" fill="#0E8A7D"/>
    <circle cx="320" cy="128" r="11" fill="#D8E5E2"/>
    <circle cx="384" cy="128" r="23" fill="#0E8A7D"/>
    <circle cx="128" cy="192" r="11" fill="#D8E5E2"/>
    <circle cx="192" cy="192" r="23" fill="#0E8A7D"/>
    <circle cx="256" cy="192" r="11" fill="#D8E5E2"/>
    <circle cx="320" cy="192" r="11" fill="#D8E5E2"/>
    <circle cx="384" cy="192" r="11" fill="#D8E5E2"/>
    <circle cx="128" cy="256" r="23" fill="#0E8A7D"/>
    <circle cx="192" cy="256" r="11" fill="#D8E5E2"/>
    <circle cx="256" cy="256" r="23" fill="#0E8A7D"/>
    <circle cx="320" cy="256" r="11" fill="#D8E5E2"/>
    <circle cx="384" cy="256" r="11" fill="#D8E5E2"/>
    <circle cx="128" cy="320" r="11" fill="#D8E5E2"/>
    <circle cx="192" cy="320" r="23" fill="#0E8A7D"/>
    <circle cx="256" cy="320" r="11" fill="#D8E5E2"/>
    <circle cx="320" cy="320" r="23" fill="#0E8A7D"/>
    <circle cx="384" cy="320" r="11" fill="#D8E5E2"/>
    <circle cx="128" cy="384" r="11" fill="#D8E5E2"/>
    <circle cx="192" cy="384" r="11" fill="#D8E5E2"/>
    <circle cx="256" cy="384" r="23" fill="#0E8A7D"/>
    <circle cx="320" cy="384" r="11" fill="#D8E5E2"/>
    <circle cx="384" cy="384" r="11" fill="#D8E5E2"/>
